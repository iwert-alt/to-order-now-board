*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13.5px/1.45 var(--font)}

button,input,select{font:inherit;color:inherit}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 8px}

.chip b{color:var(--text);margin-left:5px;font-variant-numeric:tabular-nums}
.chip.on{color:var(--text);border-color:#3d4656;background:#222833}
.chip.urgent.on,.chip[data-u="urgent"] b{color:var(--urgent)}
.chip.high.on,.chip[data-u="high"] b{color:var(--high)}
.chip.medium.on,.chip[data-u="medium"] b{color:var(--medium)}
.chip.low.on,.chip[data-u="low"] b{color:var(--low)}

.toolbar label.check{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;cursor:pointer;user-select:none}
.bands{flex:1;overflow:auto;padding:8px 12px 80px}

.band.medium .band-h{color:var(--medium)}
.band.low .band-h{color:var(--low)}

.card.urgent{--rail:var(--urgent)} .card.high{--rail:var(--high)}
.card.medium{--rail:var(--medium)} .card.low{--rail:var(--low)}

    if (c === 'ZAR') return 'R' + Number(n).toLocaleString('en-ZA', {maximumFractionDigits: 2});
    if (c === 'EUR') return '€' + Number(n).toLocaleString('en-IE', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    if (c === 'USD') return '$' + Number(n).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    return c + ' ' + n;
  };

  function filtered() {
    return items.filter(it => {
      if (state.hideArchive && it.band === 'archive') return false;
      if (state.urgency && it.urgency !== state.urgency) return false;
      if (state.cat && it.category !== state.cat) return false;
      if (state.origin && it.origin !== state.origin) return false;
      if (state.status && it.status !== state.status) return false;
      if (state.q) {
        const hay = [it.name, it.shop, it.category, it.lines, it.why, it.notes, it.sacred_yes].join(' ').toLowerCase();
        if (!hay.includes(state.q.toLowerCase())) return false;
      }
      return true;
    });
  }

  function counts() {
    const base = items.filter(it => !(state.hideArchive && it.band === 'archive'));
    const u = {urgent:0,high:0,medium:0,low:0};
    const s = {};
    base.forEach(it => { u[it.urgency] = (u[it.urgency]||0)+1; s[it.status]=(s[it.status]||0)+1; });
    return {u,s,n:base.length};
  }

  function renderStrip() {
    const parkedZar = DATA.parked_total_zar || 0;
    const el = document.getElementById('strip');
    el.innerHTML = `
      <div class="pill park"><div class="lbl">Parked checkout (ZAR)</div><div class="val">${money(parkedZar,'ZAR')}</div></div>
      <div class="pill"><div class="lbl">Ship-to</div><div class="val" style="font-size:13px;font-weight:600;margin-top:6px">${DATA.ship_to_short||'Clifton'}</div></div>
      <div class="pill warn"><div class="lbl">Charge rule</div><div class="val">Nothing charged until exact pay-yes naming the live total. No Place Order. No auto-pay.</div></div>
    `;
    document.getElementById('meta-line').textContent =
      (DATA.ship_to || '145 Kloof Road, Clifton') + ' · updated ' + (DATA.updated_sast || DATA.generated) +
      ' · ' + counts().n + ' active rows';
  }

  function renderChips() {
    const {u} = counts();
    const order = ['urgent','high','medium','low'];
    const box = document.getElementById('urgency-chips');
    box.innerHTML = order.map(k => {
      const on = state.urgency === k ? ' on' : '';
      return `<button type="button" class="chip ${k}${on}" data-u="${k}">${k.toUpperCase()}<b>${u[k]||0}</b></button>`;
    }).join('') + `<button type="button" class="chip${state.urgency===null?' on':''}" data-u="">ALL<b>${counts().n}</b></button>`;
    box.querySelectorAll('.chip').forEach(btn => {
      btn.onclick = () => {
        const v = btn.getAttribute('data-u');
        state.urgency = v === '' ? null : v;
        paint();
      };
    });
  }

  function fillFilters() {
    const cats = [...new Set(items.map(i => i.category).filter(Boolean))].sort();
    const sel = document.getElementById('f-cat');
    const cur = state.cat;
    sel.innerHTML = '<option value="">All categories</option>' + cats.map(c => `<option value="${c}">${c}</option>`).join('');
    sel.value = cur;
  }

  function renderSacred() {
    const rows = (DATA.sacred_yes || []).map(s => `<code title="${s.does}">${s.say}</code>`).join('');
    document.getElementById('sacred').innerHTML = `<h3>Sacred yes · say the words</h3><div class="sacred-row">${rows}</div>`;
  }

  function cardHtml(it) {
    const price = money(it.price, it.currency);
    const badges = [
      `<span class="badge b-${it.urgency}">${it.priority || it.urgency}</span>`,
      `<span class="badge b-${it.status}">${it.status}</span>`,
      `<span class="badge b-${it.origin}">${it.origin === 'local' ? 'LOCAL SA' : 'INTL'}</span>`,
      `<span class="badge b-cat">${it.category}</span>`,
    ].join('');
    const links = [];
    if (it.checkout_url) links.push(`<a class="btn checkout" href="${it.checkout_url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Checkout</a>`);
    if (it.cart_url) links.push(`<a class="btn cart" href="${it.cart_url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Cart</a>`);
    if (it.product_url) links.push(`<a class="btn" href="${it.product_url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Product</a>`);
    (it.product_urls||[]).slice(0,3).forEach((u,i) => links.push(`<a class="btn" href="${u}" target="_blank" rel="noopener" onclick="event.stopPropagation()">SKU ${i+1}</a>`));
    links.push(`<button type="button" class="btn compare" data-compare="${it.id}" onclick="event.stopPropagation()">Compare</button>`);

    return `<article class="card ${it.urgency}${state.sel===it.id?' sel':''}" data-id="${it.id}">
      <div class="rail"></div>
      <div class="card-top"><div class="card-name">${esc(it.name)}</div><div class="badges">${badges}</div></div>
      <div class="card-mid"><div class="price">${price}</div><div class="price-note">${esc(it.price_note||'')}</div></div>
      <div class="kv">
        <span>Shop</span><span>${esc(it.shop||'—')}</span>
        <span>Delivery</span><span>${esc(it.delivery||'—')}</span>
        <span>Lines</span><span>${esc(it.lines||'—')}</span>
        ${it.sacred_yes ? `<span>Say</span><span><code style="color:var(--parked)">${esc(it.sacred_yes)}</code></span>` : ''}
        ${it.due_date ? `<span>Due</span><span>${esc(it.due_date)}</span>` : ''}
      </div>
      <div class="actions">${links.join('')}</div>
    </article>`;
  }

  function esc(s){ return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function renderBands() {
    const list = filtered();
    const order = ['urgent','high','medium','low'];
    const box = document.getElementById('bands');
    if (!list.length) { box.innerHTML = '<div class="empty">No rows match filters.</div>'; return; }
    box.innerHTML = order.map(u => {
      const rows = list.filter(i => i.urgency === u);
      if (!rows.length) return '';
      return `<section class="band ${u}"><div class="band-h">${u} <span class="n">${rows.length}</span></div>${rows.map(cardHtml).join('')}</section>`;
    }).join('');

    box.querySelectorAll('.card').forEach(el => {
      el.onclick = () => openPanel(el.getAttribute('data-id'));
    });
    box.querySelectorAll('[data-compare]').forEach(btn => {
      btn.onclick = (e) => { e.stopPropagation(); openPanel(btn.getAttribute('data-compare')); };
    });
  }

  function openPanel(id) {
    const it = items.find(x => x.id === id);
    if (!it) return;
    state.sel = id;
    const panel = document.getElementById('panel');
    panel.classList.add('open');
    document.getElementById('panel-title').textContent = it.name;
    const cmp = (it.compared||[]).map(c => {
      const v = c.verdict || 'runner';
      const link = c.url ? ` · <a href="${c.url}" target="_blank" rel="noopener">open</a>` : '';
      return `<div class="cmp"><div class="t">${esc(c.product||'')} <span class="verdict v-${v}">${v}</span></div>
        <div class="m">${esc(c.shop||'')} · ${money(c.price,c.currency)} · ${c.origin==='international'?'INTL':'LOCAL'}${link}</div>
        <div style="margin-top:6px">${esc(c.difference||'')}</div></div>`;
    }).join('') || '<div class="m">No comparison rows on file.</div>';

    document.getElementById('panel-b').innerHTML = `
      <div class="sec"><h4>Why this pick</h4><p>${esc(it.why||'—')}</p>
        ${it.notes ? `<p style="color:var(--muted)">${esc(it.notes)}</p>` : ''}</div>
      <div class="sec"><h4>Delivery to Clifton</h4>
        <p>${esc(it.delivery||'—')}<br><span style="color:var(--muted)">${esc(it.delivery_to||DATA.ship_to_short||'')}</span></p></div>
      <div class="sec"><h4>Pay / status</h4>
        <p>Status: <b>${esc(it.status)}</b> · ${esc(it.pay_method||'')}<br>
        ${it.bank ? `Bank: ${esc(it.bank)}<br>` : ''}
        ${it.sacred_yes ? `Sacred yes: <code style="color:var(--parked)">${esc(it.sacred_yes)}</code>` : 'No pay words until parked + confirmed.'}</p></div>
      <div class="sec"><h4>Compared (why vs alts)</h4>${cmp}</div>
      <div class="sec"><h4>Links</h4>
        <p>${it.checkout_url?`<a href="${it.checkout_url}" target="_blank" rel="noopener">Checkout</a> · `:''}
           ${it.cart_url?`<a href="${it.cart_url}" target="_blank" rel="noopener">Cart</a> · `:''}
           ${(it.product_urls||[]).map((u,i)=>`<a href="${u}" target="_blank" rel="noopener">SKU ${i+1}</a>`).join(' · ')|| (it.product_url?`<a href="${it.product_url}" target="_blank" rel="noopener">Product</a>`:'—')}
        </p>
        <p style="color:var(--faint);font-size:11px;margin-top:12px">Checkout links open the shop — this board never charges.</p>
      </div>`;
    renderBands();
  }

  function paint() {
    renderStrip();
    renderChips();
    renderBands();
  }

  document.getElementById('panel-close').onclick = () => {
    state.sel = null;
    document.getElementById('panel').classList.remove('open');
    renderBands();
  };
  document.getElementById('q').oninput = (e) => { state.q = e.target.value; paint(); };
  document.getElementById('f-cat').onchange = (e) => { state.cat = e.target.value; paint(); };
  document.getElementById('f-origin').onchange = (e) => { state.origin = e.target.value; paint(); };
  document.getElementById('f-status').onchange = (e) => { state.status = e.target.value; paint(); };
  document.getElementById('hide-archive').onchange = (e) => { state.hideArchive = e.target.checked; paint(); };

  fillFilters();
  renderSacred();
  paint();
})();
</script>
</body>
</html>
